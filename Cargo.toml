[workspace]
resolver = "2"
members = [
    "crates/dir2dir-domain",
    "crates/dir2dir-application",
    "crates/dir2dir-infrastructure",
    "crates/dir2dir-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
dir2dir-domain = { path = "crates/dir2dir-domain" }
dir2dir-application = { path = "crates/dir2dir-application" }
dir2dir-infrastructure = { path = "crates/dir2dir-infrastructure" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
tempfile = "3"

[profile.release]
lto = true
strip = true
